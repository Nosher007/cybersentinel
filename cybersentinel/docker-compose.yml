version: "3.9"

# ── Production services ───────────────────────────────────────────────────────
# ChromaDB is baked into the backend image at build time (Option A).
# No separate ChromaDB container needed.
#
# Airflow runs as a separate optional service for the nightly CVE pipeline.
# It is NOT required for the core CyberSentinel game to run.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHROMA_PATH=/app/chroma-data
      - CHROMA_COLLECTION_NAME=cybersentinel_kb
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      # API keys injected at runtime — never hardcoded here
      # Set GOOGLE_API_KEY via: docker compose run -e GOOGLE_API_KEY=... backend
      # Or use a .env file locally (gitignored)
    env_file:
      - .env
    restart: unless-stopped

